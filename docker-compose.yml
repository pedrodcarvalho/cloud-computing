version: '3.8'

services:
  frontend:
    container_name: frontend
    build:
      context: ./client
    ports:
      - "3000:80"  # Exponha a porta 3000 do container na porta 3000 do host
    networks:
      - frontend-backend-net
    deploy:
      resources:
        limits:
          cpus: "2"  # Alocação de 2 núcleos
          memory: 2G  # Alocação de 2GB de RAM
    depends_on:
      - backend

  backend:
    container_name: backend
    build:
      context: ./server
    ports:
      - "5000:5000"  # Exponha a porta 5000 do container
    networks:
      - frontend-backend-net
      - backend-db-net
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    depends_on:
      - db

  db:
    container_name: db
    image: mongo
    ports:
      - "27017:27017"  # Exponha a porta padrão do MongoDB
    networks:
      - backend-db-net
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    volumes:
      - db_data:/data/db

networks:
  frontend-backend-net:
    driver: bridge  # Rede para comunicação entre frontend e backend
  backend-db-net:
    driver: bridge  # Rede para comunicação entre backend e DB
    internal: true  # Rede interna sem acesso a internet

volumes:
  db_data:
    driver: local  # Volume para persistência dos dados do MongoDB
