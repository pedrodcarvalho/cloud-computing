version: '3.8'

services:
  frontend:
    container_name: frontend
    build:
      context: ./client
    ports:
      - '3000:80'
    networks:
      - frontend-backend-net
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    depends_on:
      - backend

  backend:
    container_name: backend
    build:
      context: ./server
    ports:
      - '5000:5000'
    networks:
      - frontend-backend-net
      - backend-db-net
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    depends_on:
      - db

  db:
    container_name: db
    image: mongo
    ports:
      - '27017:27017'
    networks:
      - backend-db-net
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    volumes:
      - db_data:/data/db

networks:
  frontend-backend-net:
    driver: bridge
  backend-db-net:
    driver: bridge
    internal: true

volumes:
  db_data:
    driver: local
