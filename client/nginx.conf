server {
    listen 80;

    # Root file config
    root /usr/share/nginx/html;
    index index.html;

    # All routes will be treated from index.html entrypoint
    location / {
        try_files $uri /index.html;
    }

    # Static files config
    location /static/ {
        # Static cache
        expires 1y;
        add_header Cache-Control "public";
    }

    error_page 404 /index.html;
}
